[project]
name = "ciffer"
version = "0.1.0"
description = "CIF structures as plain NumPy arrays."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Howon Lee", email = "hwlee7771@gmail.com" }]
dependencies = ["gemmi>=0.7.5", "numpy>=2.2", "zstandard>=0.25.0"]

[project.urls]
Repository = "https://github.com/Buddha7771/ciffer"
Issues = "https://github.com/Buddha7771/ciffer/issues"

[dependency-groups]
dev = ["pre-commit>=4.6", "pytest>=9.0.3", "ruff==0.17.0", "ty==0.0.88"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciffer"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
extend-select = [
  "D417",
] # Disabled by the numpy convention; keep Parameters complete
ignore = [
  "COM812",  # Conflicts with ruff formatter
  "CPY001",  # Missing copyright notice
  "D100",    # Missing docstring in public module
  "D104",    # Missing docstring in public package
  "ANN401",  # Dynamically typed expressions (typing.Any)
  "PLR0913", # Too many arguments in function definition
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "D", "INP001", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
